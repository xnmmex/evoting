
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Suara Digital</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            display: block;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
        }

        .card:has(input:checked) {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .card input {
            transform: scale(1.5);
            margin-bottom: 15px;
        }

        .img-container {
            width: 140px;
            height: 180px;
            margin: auto;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h3 {
            color: #0f172a;
        }

        .card p {
            color: #475569;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
        }

        .btn-submit:hover {
            background: #15803d;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>SURAT SUARA DIGITAL</h1>

        <p class="subtitle">
            Pemilihan Kelurahan - TPS Offline
        </p>

        <form action="{{ url_for('vote') }}" method="POST">

            <div class="candidate-grid">

                {% for candidate in candidates %}

                <label class="card">

                    <input
                        type="radio"
                        name="candidate_id"
                        value="{{ candidate.id }}"
                        required
                    >

                    <div class="img-container">
                        <img
                            src="{{ url_for('static', filename='images/' + candidate.photo) }}"
                            alt="{{ candidate.name }}"
                        >
                    </div>

                    <h3>{{ candidate.name }}</h3>

                    <p>{{ candidate.vision }}</p>

                </label>

                {% endfor %}

            </div>

            <button
                type="submit"
                class="btn-submit"
                onclick="return confirm('Apakah Anda yakin dengan pilihan Anda? Suara tidak dapat diubah setelah dikirim.')"
            >
                KIRIM SUARA
            </button>

        </form>

    </div>
</body>
</html>
